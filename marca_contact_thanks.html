<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>送信完了｜MARCA</title>
  <style>
    :root {
      --bg: #f8f5ee;
      --paper: #ffffff;
      --ink: #263027;
      --muted: #667060;
      --green: #3f6f43;
      --line: #d9dfd0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.7;
    }
    .card {
      width: min(680px, 100%);
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: clamp(26px, 5vw, 46px);
      box-shadow: 0 16px 38px rgba(38,48,39,.08);
      text-align: center;
    }
    .logo {
      font-size: 30px;
      font-weight: 900;
      letter-spacing: .1em;
      color: var(--green);
      margin-bottom: 20px;
    }
    h1 {
      margin: 0 0 14px;
      font-size: clamp(26px, 5vw, 38px);
    }
    p {
      margin: 0 0 22px;
      color: var(--muted);
    }
    a {
      display: inline-block;
      padding: 13px 18px;
      border-radius: 12px;
      background: var(--green);
      color: #fff;
      text-decoration: none;
      font-weight: 800;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">MARCA</div>
    <h1>送信が完了しました</h1>
    <p>
      お問い合わせありがとうございます。<br>
      内容を確認のうえ、担当者よりご連絡いたします。
    </p>
    <a href="https://marca-1.github.io/HP/">MARCAページへ戻る</a>
  </div>
</body>
</html>
